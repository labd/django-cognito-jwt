[project]
name = "django-cognito-jwt"
version = "0.0.4"
description = "Django backends for AWS Cognito JWT"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael van Tellingen", email = "m.vantellingen@labdigital.nl" }]
requires-python = ">=3.11"
dependencies = [
    "Django>=4.2",
    "cryptography",
    "djangorestframework",
    "pyjwt",
    "requests",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/labd/django-cognito-jwt"
Documentation = "https://django-cognito-jwt.readthedocs.io/"
Changelog = "https://github.com/labd/django-cognito-jwt/blob/master/CHANGES"

[dependency-groups]
dev = [
    "coverage[toml]>=7",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-django>=4.9",
    "pytest-responses>=0.5.1",
    "ruff>=0.17",
    "tox>=4.26",
    "tox-uv>=1.28",
]
docs = [
    "sphinx>=1.4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_cognito_jwt"]

[tool.hatch.build.targets.sdist]
include = [
    "src/django_cognito_jwt",
    "tests",
    "CHANGES",
    "LICENSE",
    "README.rst",
]

[tool.pytest.ini_options]
minversion = "8.0"
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["django_cognito_jwt"]

[tool.coverage.paths]
source = ["src", "*/.tox/*/site-packages"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["django_cognito_jwt", "tests"]
