[tox]
requires =
    tox>=4.26
    tox-uv>=1.28
envlist =
    py{311,312,313,314}-django52
    py{312,313,314}-django60
    format

[testenv]
dependency_groups = dev
commands =
    coverage run -m pytest {posargs}
    coverage report
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1

[testenv:format]
skip_install = true
deps = ruff
commands =
    ruff format --check src tests
    ruff check src tests
