[tox]
envlist =
    py{311,312}-django42
    py{311,312,313,314}-django52
    py{312,313,314}-django60


[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
commands = coverage run --source django_cognito_jwt --parallel -m pytest {posargs}
deps =
    django42: Django>=4.2,<4.3
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
extras = test

[testenv:coverage-report]
basepython = python3.13
deps = coverage[toml]
skip_install = true
commands =
    coverage combine
    coverage xml
    coverage report

[testenv:format]
basepython = python3.13
deps = ruff
skip_install = true
commands =
    ruff format --check src tests
    ruff check src tests
