---
sudo: false
language: python

matrix:
  include:
    - python: 3.6
      env: TOXENV=py36-django111
    - python: 3.6
      env: TOXENV=py36-django20

before_cache:
  - rm -rf $HOME/.cache/pip/log

cache:
  directories:
    - $HOME/.cache/pip

install:
  - pip install tox

script:
  - tox -e $TOXENV

after_success:
  - tox -e coverage-report

notifications:
  email: false
