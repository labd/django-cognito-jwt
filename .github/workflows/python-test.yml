name: Python Tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Validate formatting
        run: |
          uv run --frozen ruff format --check src tests
          uv run --frozen ruff check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.11", django: django52 }
          - { python: "3.12", django: django52 }
          - { python: "3.13", django: django52 }
          - { python: "3.14", django: django52 }
          - { python: "3.12", django: django60 }
          - { python: "3.13", django: django60 }
          - { python: "3.14", django: django60 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Test with tox
        run: uvx --with tox-uv tox -e "py${PYTHON//./}-${DJANGO}"
        env:
          PYTHON: ${{ matrix.python }}
          DJANGO: ${{ matrix.django }}
